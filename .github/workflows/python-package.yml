name: Python package

on: [push, pull_request]

jobs:
  build:

    name: "build (${{ matrix.runs_on }}, ${{ matrix.python }})"
    runs-on: ${{ matrix.runs_on }}
    strategy:
      matrix:
        runs_on: ['macos-latest', 'macos-15-intel']
        python:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
        include:
          - runs_on: macos-latest
            python: "3.14"
            coverage: true
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python }}

    - name: Install CI/CD requirements
      run: |
        pip install -r .ci/cicd-requirements.txt

    - name: Install project
      if: matrix.coverage != true
      run: |
        pip install -e .

    - name: Install instrumented project
      if: matrix.coverage == true
      env:
        PYOBJUS_COVERAGE: '1'
      run: |
        python -m pip install "Cython>3" "setuptools>=77" wheel
        python -m pip install --no-build-isolation -e .
        python setup.py build_ext --inplace --force

    - name: Build test libraries
      run: make test_lib

    - name: Test with pytest
      if: matrix.coverage != true
      run: python -m pytest tests -v

    - name: Test with Python and Cython coverage
      if: matrix.coverage == true
      run: python -m pytest tests -v --cov --cov-report=xml:coverage.xml

    - name: Upload Python and Cython coverage to Coveralls
      if: matrix.coverage == true
      uses: coverallsapp/github-action@v2
      with:
        file: coverage.xml
        # The Cobertura uploader ignores XML <sources>; retain repository paths.
        base-path: pyobjus
        fail-on-error: false

  unsupported-platform:
    # pyobjus only builds on macOS and iOS. Elsewhere, building an sdist must
    # still work, and installing must fail with a clear error.
    name: "unsupported platform (ubuntu-latest)"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'

    - name: Build sdist
      run: |
        pip install build
        python -m build --sdist

    - name: Install fails with a clear error
      run: |
        if pip install . > install.log 2>&1; then
          cat install.log
          echo "::error::pip install unexpectedly succeeded on Linux"
          exit 1
        fi
        cat install.log
        grep -q "can only be built on macOS or iOS" install.log

  examples:
    # Headless examples, once, on Apple silicon. The unit-test matrix already
    # covers the Python versions. Intel stays on the unit-test matrix only.
    name: "examples (macos-latest)"
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.15"

    - name: Install CI/CD requirements
      run: |
        pip install -r .ci/cicd-requirements.txt

    - name: Install project
      run: |
        pip install -e .

    - name: Build test libraries
      run: make test_lib

    - name: Run headless examples
      run: python .ci/run_examples.py
